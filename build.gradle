buildscript {
	apply from: 'versions.gradle'
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'az'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(26)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', v.springCloud)
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.security:spring-security-messaging'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'io.projectreactor:reactor-core'

	implementation "io.github.resilience4j:resilience4j-spring-boot3:${v.resilience4j}"
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${v.springdoc}"
	implementation "com.googlecode.libphonenumber:libphonenumber:${v.libphonenumber}"
	implementation "software.amazon.awssdk:apache-client:${v.awssdk}"
	implementation "net.bytebuddy:byte-buddy:${v.byteBuddy}"
	implementation "org.mapstruct:mapstruct:${v.mapstruct}"
	implementation "software.amazon.awssdk:s3:${v.awssdk}"
	implementation "commons-io:commons-io:${v.commonsIo}"
	implementation "com.stripe:stripe-java:${v.stripe}"
	implementation "io.jsonwebtoken:jjwt-api:${v.jjwt}"

	implementation platform("software.amazon.awssdk:bom:${v.awssdk}")

	compileOnly 'org.projectlombok:lombok'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	runtimeOnly 'org.postgresql:postgresql'

	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${v.jjwt}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${v.jjwt}"

	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
