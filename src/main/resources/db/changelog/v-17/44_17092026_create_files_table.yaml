databaseChangeLog:
  - changeSet:
      id: 44_17092026_create_files_table
      author: Jahangir Alisoy
      changes:
        - createTable:
            tableName: files
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: original_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: content_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: size
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: content
                  type: BYTEA
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false