server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopery_db}
    username: ${DB_USERNAME:shopery_user}
    password: ${DB_PASSWORD:shopery_pass}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: false

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

feign:
  client:
    config:
      blog-ms:
        url: ${BLOG_MS:http://localhost:8083}
      aws-ms:
        url: ${AWS_MS:http://localhost:8084}
